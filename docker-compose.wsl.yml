# WSL-optimized Docker Compose for OpenClaw
# Usage:
#   1. Copy .env.wsl.example to .env and fill in values
#   2. docker compose -f docker-compose.wsl.yml up -d
#   3. docker compose -f docker-compose.wsl.yml exec cli openclaw --help
#
# Gateway runs directly (no systemd needed).
# Data persists in ~/.bao on the WSL host.

services:
  gateway:
    image: ghcr.io/baoduong/openclaw:latest
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      OPENCLAW_ALLOW_INSECURE_PRIVATE_WS: ${OPENCLAW_ALLOW_INSECURE_PRIVATE_WS:-}
      TZ: ${OPENCLAW_TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - ${OPENCLAW_DATA_DIR:-~/.bao}:/home/node/.openclaw
    ports:
      - "${OPENCLAW_GATEWAY_PORT:-18789}:18789"
      - "${OPENCLAW_BRIDGE_PORT:-18790}:18790"
    init: true
    restart: unless-stopped
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "${OPENCLAW_GATEWAY_BIND:-lan}",
        "--port",
        "18789",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:18789/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  cli:
    image: ghcr.io/baoduong/openclaw:latest
    network_mode: "service:gateway"
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      OPENCLAW_ALLOW_INSECURE_PRIVATE_WS: ${OPENCLAW_ALLOW_INSECURE_PRIVATE_WS:-}
      BROWSER: echo
      TZ: ${OPENCLAW_TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - ${OPENCLAW_DATA_DIR:-~/.bao}:/home/node/.openclaw
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["node", "dist/index.js"]
    depends_on:
      gateway:
        condition: service_healthy
    profiles:
      - cli
