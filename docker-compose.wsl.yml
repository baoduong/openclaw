# WSL-optimized Docker Compose for OpenClaw
# Usage:
#   1. Copy .env.wsl.example to .env and fill in values
#   2. docker compose -f docker-compose.wsl.yml up -d gateway
#   3. docker compose -f docker-compose.wsl.yml exec gateway node dist/index.js <cmd>
#
# Uses host networking so localhost MCP servers (e.g. hal-knowledge-base:3000)
# are reachable directly. Runs as root to avoid /mnt/c permission issues.
# Data persists in ~/.bao on the WSL host.

services:
  gateway:
    image: ghcr.io/baoduong/openclaw:latest
    user: root
    network_mode: host
    environment:
      HOME: /root
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      OPENCLAW_ALLOW_INSECURE_PRIVATE_WS: ${OPENCLAW_ALLOW_INSECURE_PRIVATE_WS:-}
      TZ: ${OPENCLAW_TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - ${OPENCLAW_DATA_DIR:-~/.bao}:/root/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR:-/mnt/c/Users/baodt10/projects/hal_repos}:/root/.openclaw/workspace
    init: true
    restart: unless-stopped
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "${OPENCLAW_GATEWAY_BIND:-lan}",
        "--port",
        "${OPENCLAW_GATEWAY_PORT:-18789}",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:${OPENCLAW_GATEWAY_PORT:-18789}/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  cli:
    image: ghcr.io/baoduong/openclaw:latest
    user: root
    network_mode: host
    environment:
      HOME: /root
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      OPENCLAW_ALLOW_INSECURE_PRIVATE_WS: ${OPENCLAW_ALLOW_INSECURE_PRIVATE_WS:-}
      BROWSER: echo
      TZ: ${OPENCLAW_TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - ${OPENCLAW_DATA_DIR:-~/.bao}:/root/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR:-/mnt/c/Users/baodt10/projects/hal_repos}:/root/.openclaw/workspace
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["node", "dist/index.js"]
    profiles:
      - cli
