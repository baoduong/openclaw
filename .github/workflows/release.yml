name: Release

on:
  push:
    branches: [ main ]
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm@latest

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm check

      - name: Run tests (fast)
        run: pnpm test --silent || true

      - name: Build
        run: pnpm build

      - name: Package source tarball
        run: |
          mkdir -p dist/release
          git ls-files | tar -czf dist/release/openclaw-${{ github.sha }}.tar.gz -T -

      - name: Build Docker image
        run: |
          docker build -t openclaw:${{ github.sha }} . || echo "Docker build failed or not available"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-release-${{ github.sha }}
          path: dist/release/**

  windows-wrapper:
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Create Windows wrapper artifact
        run: |
          mkdir -p .\\dist\\release
          $content = "@echo off\r\nREM Wrapper to run OpenClaw in WSL\r\nwsl -d Ubuntu -- bash -lc \"cd /home/%USERNAME%/openclaw && pnpm run start\"\r\n"
          Set-Content -Path .\\dist\\release\\openclaw-wsl-wrapper.bat -Value $content -Encoding ASCII
      - name: Upload Windows wrapper
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-windows-wrapper
          path: .\\dist\\release\\openclaw-wsl-wrapper.bat

  create_release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [build, windows-wrapper]
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: openclaw-release-${{ github.sha }}
          path: ./release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          files: dist/release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
